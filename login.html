<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Abhideepam</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo">
        <div class="logo-icon">अ</div>
        <div class="logo-text">Abhi<span>deepam</span></div>
      </a>
      <div class="nav-right">
        <button class="lang-toggle" id="langToggle"><i class="fas fa-globe"></i> हिं</button>
        <a href="register.html" class="auth-btn register">Register</a>
      </div>
    </div>
  </nav>

  <div class="auth-page">
    <div class="auth-card">
      <div style="text-align:center;margin-bottom:1.5rem">
        <div class="logo-icon" style="margin:0 auto 1rem;width:52px;height:52px;font-size:1.5rem">अ</div>
        <h2>Welcome Back</h2>
        <p class="subtitle">Login to access your tests, classes & dashboard</p>
      </div>

      <form data-supabase-auth="login">
        <div class="form-group"><label>Email</label><input name="email" type="email" required autocomplete="email" placeholder="your@email.com"></div>
        <div class="form-group"><label>Password</label><input name="password" type="password" required autocomplete="current-password" placeholder="Aapka password"></div>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center"><i class="fas fa-sign-in-alt"></i> Login</button>
      </form>

      <div class="form-footer">
        New student? <a href="register.html">Create Account</a>
      </div>

      <div style="margin-top:1.8rem;padding-top:1.5rem;border-top:1px solid #e2e8f0;text-align:center">
        <p style="font-size:0.85rem;color:#64748b;margin-bottom:0.8rem">Admin Login</p>
        <a href="admin.html" class="auth-btn" style="display:inline-flex;border-color:#cbd5e1;color:#475569">
          <i class="fas fa-shield-alt"></i> &nbsp; Go to Admin Dashboard
        </a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script><script src="js/supabase-client.js"></script><script src="js/auth.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
